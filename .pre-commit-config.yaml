repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      #----------------#
      # Common checks
      - id: check-yaml
        name: check yaml syntax
        description: checks yaml files for parseable syntax
        entry: check-yaml -m
        language: python
        types: [yaml]
      - id: check-json
        name: check json syntax
        description: checks json files for parseable syntax.
        entry: check-json
        language: python
        types: [json]
      - id: check-toml
        name: check toml syntax
        description: checks toml files for parseable syntax.
        entry: check-toml
        language: python
        types: [toml]
      - id: check-added-large-files
        name: check for added large file
        description: prevents giant files from being committed
        entry: check-added-large-files
        language: python
      - id: check-symlinks
        name: check for broken symlinks
        description: checks for symlinks which do not point to anything
        entry: check-symlinks
        language: python
        types: [symlink]
      - id: check-merge-conflict
        name: check for merge conflicts
        description: check for files that contain merge conflict strings
        entry: check-merge-conflict
        language: python
        types: [text]

  - repo: local
    hooks:
      #----------------#
      # Cpp checks
      - id: clang-format
        name: clang-format
        description: runs clang-format on a predefined sets of files
        language: system
        entry: clang-format -i
        types_or: [c++, c, 'c#', cuda, proto]
      - id: cppcheck
        verbose: true
        name: cppcheck
        description: runs cppcheck on changed files
        language: system
        entry: cppcheck . --error-exitcode=1
        types_or: [c++, c, 'c#', cuda, proto]
      - id: cpplint
        name: cpplint
        description: runs cpplint on changed files
        language: system
        entry: cpplint
        types_or: [c++, c, 'c#', cuda, proto]
      - id: clang-tidy
        name: clang-tidy
        description: runs clang-tidy on changed files
        language: system
        entry: clang-tidy
        types_or: [c++, c, 'c#', cuda, proto]
      # - id: docs
      #   name: Doxygen successful generation
      #   description: runs doxygen and checks for errors
      #   language: system
      #   pass_filenames: false
      #   entry: bash -c 'cd src && make doc'
      #   types_or: [text]
