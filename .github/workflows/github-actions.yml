name: pre-commit
run-name: ${{ github.actor }} pushed
on: [push]
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pre-commit cppcheck clang-format git cpplint clang-tidy googletest libgtest-dev cmake
          version: 1.0
      - run: pre-commit run --all-files
